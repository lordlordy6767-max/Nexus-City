openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Shared game server status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/info:
    get:
      operationId: getGameInfo
      tags: [game]
      summary: Get current multiplayer server status
      responses:
        "200":
          description: Current game server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameInfo"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameInfo:
      type: object
      properties:
        name:
          type: string
        onlinePlayers:
          type: integer
        maxPlayers:
          type: integer
        availableCars:
          type: integer
        citySize:
          type: integer
        tickRate:
          type: integer
      required:
        - name
        - onlinePlayers
        - maxPlayers
        - availableCars
        - citySize
        - tickRate

